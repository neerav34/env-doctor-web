<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>env-doctor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground:  #090e1b;
    --surface: #0f1729;
    --border:  #1e2c42;
    --text:    #dde4ef;
    --muted:   #5c7394;
    --accent:  #22d3a0;
    --error:   #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ground:  #f1f5fb; --surface: #ffffff; --border: #ced9e8;
      --text:    #0c1a2e; --muted:   #6d8aaa; --accent: #0fa87e; --error: #dc2626;
    }
  }
  :root[data-theme="light"] {
    --ground:  #f1f5fb; --surface: #ffffff; --border: #ced9e8;
    --text:    #0c1a2e; --muted:   #6d8aaa; --accent: #0fa87e; --error: #dc2626;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .gate {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px 44px; width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .hb {
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; font-weight: 700; letter-spacing: -0.02em;
  }
  .hb-d { color: var(--accent); }
  .hb-pulse {
    width: 32px; height: 16px; flex-shrink: 0;
  }
  @keyframes hb { 0%{stroke-dashoffset:80;opacity:0} 15%{opacity:1} 100%{stroke-dashoffset:0;opacity:1} }
  @media (prefers-reduced-motion: reduce) { .hbp { animation: none; stroke-dashoffset: 0; opacity: 1; } }
  .hbp { stroke-dasharray: 80; stroke-dashoffset: 80; animation: hb 1.6s ease-out forwards; }
  .desc {
    font-size: 13px; color: var(--muted); line-height: 1.6;
  }
  .hint {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--muted); background: color-mix(in srgb, var(--muted) 10%, transparent);
    border: 1px solid var(--border); border-radius: 5px; padding: 5px 10px;
    display: inline-block;
  }
  .field {
    display: flex; flex-direction: column; gap: 7px;
  }
  label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  input[type="password"] {
    width: 100%; background: color-mix(in srgb, var(--accent) 4%, var(--ground));
    border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px;
    padding: 10px 14px; outline: none; transition: border-color 0.15s;
  }
  input[type="password"]:focus { border-color: var(--accent); }
  button {
    width: 100%; background: var(--accent); color: #060d1a;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    border: none; border-radius: 7px; padding: 11px; cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.88; }
  .err { color: var(--error); font-size: 12px; font-family: 'JetBrains Mono', monospace; display: none; }
  .err.on { display: block; }
</style>
</head>
<body>
<div class="gate">
  <div class="hb">
    env<span class="hb-d">-doctor</span>
    <svg class="hb-pulse" viewBox="0 0 32 16" fill="none" aria-hidden="true">
      <polyline class="hbp" points="0,8 6,8 9,2 12,14 15.5,4 18.5,8 32,8"
        stroke="#22d3a0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="desc">Internal reference manual. Passphrase required.</p>
  <div class="hint">Hint: Landline</div>
  <form class="field" id="f">
    <label for="pw">Passphrase</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus spellcheck="false">
    <button type="submit">Open</button>
    <span class="err" id="err">Wrong passphrase.</span>
  </form>
</div>

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw  = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.classList.remove('on');
  try {
    const km  = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: SALT, iterations: 250000, hash: 'SHA-256' },
      km,
      { name: 'AES-GCM', length: 256 },
      false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: IV }, key, CIPHER);
    const html  = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch {
    err.classList.add('on');
    document.getElementById('pw').value = '';
  }
});
</script>
